name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 单元测试
        run: node --test test/*.test.js

      - name: CLI 冒烟测试
        run: |
          node src/cli.js version
          node src/cli.js rules
          node src/cli.js score examples/demo-good.md

      - name: 坏文档检查应非零退出
        run: |
          set +e
          node src/cli.js check examples/demo-bad.md > /dev/null
          code=$?
          set -e
          echo "exit=$code"
          test $code -ne 0

      - name: 发布体积报告
        if: matrix.node-version == '22.x'
        run: |
          npm pack --dry-run | tail -25

      - name: 增量检查：新增问题应非零退出
        run: |
          git config user.email ci@example.com
          git config user.name ci
          git add -A
          git commit -q -m base
          echo '# 新文档' > new-doc.md
          echo 'TODO: 待补充。' >> new-doc.md
          set +e
          node src/cli.js diff --enable placeholder-text new-doc.md > /dev/null
          code=$?
          set -e
          echo "exit=$code"
          test $code -eq 2
